site_name: PyORB Documentation
site_description: Oil Record Book System — MARPOL Annex I Compliant
site_author: NAS-warrior
site_url: https://github.com/NAS-warrior/PyORB

theme:
  name: material
  palette:
    primary: blue
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: user/getting_started.md
  - MARPOL Reference:
    - Overview: marpol/overview.md
    - Part I Operation Codes: marpol/part1_codes.md
    - Part II Operation Codes: marpol/part2_codes.md
  - Technical:
    - System Architecture: technical/architecture.md
    - Operational Modes: technical/modes.md
    - Database Design: technical/database.md
    - Installation Guide: technical/installation.md
    - Security Guide: technical/security.md
  - Development:
    - Changelog: development/changelog.md
    - Roadmap: development/roadmap.md

plugins:
  - search
